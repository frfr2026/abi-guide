  - id: "S16"
    name: "SEO_PERF"
    status: "done"
    checkpoint: true
    notes: "Refonte SEO et performance des 64 pages (index + 63 pages) + fichiers racine. (1) Outils : tools/seo_config.py (source unique de verite, SITE_URL a definir avant mise en ligne), tools/build_s16.py (reecriture des <head>, idempotent verifie sur 3 passages consecutifs), tools/build_s16_files.py (sitemap, robots, 404, manifest), tools/audit_seo.py (conformite SEO), tools/test_s16.js (51 assertions jsdom). (2) Balises head homogenisees sur les 64 pages : title <= 60 caracteres (max 59), description <= 160 (max 160), meta robots explicite avec max-image-preview:large + max-snippet:-1, canonical absolute coherent avec l'URL de la page, hreflang fr, link rel=sitemap, theme-color clair et sombre, Open Graph complet (type, site_name, locale fr_FR, title, description, url, image, image:width, image:height, image:alt, image:type), Twitter Card summary_large_image (title, description, image, image:alt), article:section. (3) Donnees structurees JSON-LD : un bloc @graph unique par page avec Organization (#organization, logo 512x512 JPG), WebSite (#website, publisher, inLanguage fr-FR), WebPage (#webpage, isPartOf, primaryImageOfPage, dates), BreadcrumbList (#breadcrumb, itemListElement reconstruit depuis le fil d'Ariane visible) et Article (#article) sur les pages editoriales ; VideoGame ajoute sur l'accueil. Toutes les references @id sont croisees, aucune reference orpheline. (4) Performance : width et height sur les 130 balises img (anti-CLS), decoding=async, preload fetchpriority=high de l'image LCP de l'accueil, 16.5 Ko de CSS gzip (budget 80 Ko) et 32.2 Ko de JS gzip (budget 300 Ko). (5) sitemap.xml : 64 URL indexables, uniquement <loc> et <lastmod> au format W3C Datetime avec decalage horaire (ni priority ni changefreq, ignores par Google), 404.html exclu ; chaque URL verifiee contre le fichier reel. (6) robots.txt : a la racine, racine autorisee pour les robots de recherche, /tools/ et /backup/ exclus, directive Sitemap en URL absolue, crawlers d'entrainement IA bloques (GPTBot, CCBot, ClaudeBot, Google-Extended, Applebot-Extended, Bytespider, Meta-ExternalAgent) et crawlers de citation autorises (Googlebot, Bingbot, PerplexityBot) ; aucune utilisation de noindex dans robots.txt ou il ne fonctionne pas. (7) 404.html : page d'erreur personnalisee construite depuis le gabarit d'index.html (navigation globale et footer 8 colonnes conserves a l'identique, recherche globale operationnelle), meta noindex, 8 raccourcis vers les sections principales, image JPG cinematique 1938x812 ; configuration serveur nginx / Apache / Netlify / Vercel fournie dans DEPLOIEMENT.md pour renvoyer un vrai code HTTP 404. (8) manifest.json : id, display_override, categories, orientation, 4 icones JPG (dont une maskable) et 4 raccourcis (Debuter, Loadout, Tier List, Cartes). (9) 4 images JPG generees : 404-secteur-perdu.jpg (1938x812) et 3 cartes Open Graph 1200x630 recadrees depuis les visuels originaux (og-accueil, og-outils, og-archives) ; les og:image verticaux ont ete remplaces par des cartes paysage dediees. (10) Audit final : tools/audit.py 63 pages 0 erreur 63/63 HTTP 200 ; tools/audit_seo.py 0 erreur ; tools/test_s15.js 58/58 ; tools/test_s16.js 51/51."
